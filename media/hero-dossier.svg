<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-label="A stack of patient dossiers with an ECG trace">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="14" stdDeviation="14" flood-color="#5a4a2e" flood-opacity=".16"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .07 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#EFE8DA"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFD9AA"/><stop offset="1" stop-color="#E2C68E"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#D8CDBA" stroke-width=".6"/>
    </pattern>
    <pattern id="gridL" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="url(#grid)"/>
      <path d="M60 0H0V60" fill="none" stroke="#CDBFA7" stroke-width="1"/>
    </pattern>
    <clipPath id="ecgClip"><rect x="0" y="0" width="420" height="190"/></clipPath>
  </defs>

  <g transform="translate(330 380)">
    <!-- lower sheets, fanned -->
    <g filter="url(#sh)">
      <rect x="-250" y="-330" width="500" height="660" rx="6" fill="url(#pg)" stroke="#E2D8C6" transform="rotate(34)"/>
      <rect x="-250" y="-330" width="500" height="660" rx="6" fill="url(#pg)" stroke="#E2D8C6" transform="rotate(30) translate(6 -4)"/>
    </g>
    <!-- folder tab on a middle sheet -->
    <g transform="rotate(27) translate(2 -8)">
      <path d="M-120 -330 v-24 a8 8 0 0 1 8 -8 h70 a8 8 0 0 1 8 8 v24 z" fill="url(#tab)" stroke="#D3B67C"/>
    </g>
    <g filter="url(#sh)">
      <rect x="-250" y="-330" width="500" height="660" rx="6" fill="url(#pg)" stroke="#E2D8C6" transform="rotate(27) translate(2 -8)"/>
      <rect x="-250" y="-330" width="500" height="660" rx="6" fill="url(#pg)" stroke="#E2D8C6" transform="rotate(24) translate(-2 -12)"/>
    </g>
    <!-- top sheet -->
    <g transform="rotate(21) translate(-6 -16)" filter="url(#sh)">
      <rect x="-250" y="-330" width="500" height="660" rx="6" fill="url(#pg)" stroke="#DCD1BD"/>
      <rect x="-250" y="-330" width="500" height="660" rx="6" fill="#fff" filter="url(#grain)"/>
      <!-- header lines -->
      <g fill="#DED4C2">
        <rect x="-205" y="-290" width="150" height="7" rx="3.5"/>
        <rect x="-205" y="-272" width="95" height="5" rx="2.5"/>
        <rect x="120" y="-290" width="85" height="7" rx="3.5"/>
      </g>
      <!-- ECG strip -->
      <g transform="translate(-210 -235)">
        <rect width="420" height="190" fill="url(#gridL)" stroke="#CDBFA7"/>
        <g clip-path="url(#ecgClip)">
          <path fill="none" stroke="#55534F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
            d="M0 110 H24 q6 -8 12 0 H52 l5 6 l9 -74 l9 92 l6 -24 H100 q14 -14 26 0 H160
               q6 -8 12 0 H188 l5 6 l9 -74 l9 92 l6 -24 H236 q14 -14 26 0 H296
               q6 -8 12 0 H324 l5 6 l9 -74 l9 92 l6 -24 H372 q14 -14 26 0 H420"/>
        </g>
      </g>
      <!-- body text lines -->
      <g fill="#E3DAC9">
        <rect x="-205" y="-10" width="410" height="5" rx="2.5"/>
        <rect x="-205" y="8" width="380" height="5" rx="2.5"/>
        <rect x="-205" y="26" width="400" height="5" rx="2.5"/>
        <rect x="-205" y="44" width="250" height="5" rx="2.5"/>
        <rect x="-205" y="80" width="410" height="5" rx="2.5"/>
        <rect x="-205" y="98" width="360" height="5" rx="2.5"/>
        <rect x="-205" y="116" width="395" height="5" rx="2.5"/>
        <rect x="-205" y="134" width="210" height="5" rx="2.5"/>
      </g>
      <!-- one highlighted evidence line, the Anjana touch -->
      <rect x="-208" y="76" width="236" height="13" rx="2" fill="#B87806" opacity=".16"/>
    </g>
  </g>
</svg>
